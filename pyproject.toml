[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cozmo-agent"
version = "0.3.0"
description = "Local-first CLI coding agent: multi-model ReAct, hybrid RAG, guardrails"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Shashwat Pratap Singh", email = "singhshashwat.go@gmail.com" },
]
keywords = [
    "cli",
    "coding-agent",
    "llm",
    "rag",
    "openai",
    "ollama",
    "react",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "tenacity>=8.2",
    "questionary>=2.0",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.2",
    "twine>=5.0",
]
vector = [
    "chromadb>=0.5",
]
mcp = [
    "mcp>=1.28,<2",
]

[project.urls]
Homepage = "https://github.com/ShashwatXD/cozmo"
Repository = "https://github.com/ShashwatXD/cozmo"
Issues = "https://github.com/ShashwatXD/cozmo/issues"

[project.scripts]
cozmo = "cozmo.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cozmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
