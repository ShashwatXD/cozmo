[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cozmo"
version = "0.2.0"
description = "Production-style CLI coding agent: ReAct tools, RAG, memory, eval, OpenAI/Ollama gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cozmo = "cozmo.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cozmo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
