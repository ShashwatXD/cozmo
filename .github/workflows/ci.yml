name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests benchmarks
      - name: Ruff format
        run: ruff format --check src tests benchmarks
      - name: Mypy
        run: mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # retrieval quality gate indexes a pinned commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,mcp]"
      - name: Pytest + coverage gate
        run: pytest -q --cov=cozmo --cov-report=term --cov-report=xml
      - name: Golden agent eval
        run: cozmo eval
      - name: Retrieval benchmark (offline)
        if: matrix.python-version == '3.12'
        run: python benchmarks/run_retrieval.py --repeats 1
